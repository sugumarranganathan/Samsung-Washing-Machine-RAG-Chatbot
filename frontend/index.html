<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Samsung Washing Machine AI Support</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 700px;
            height: 90vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #1428a0;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fc;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .user {
            justify-content: flex-end;
        }

        .bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .message-content {
            background: #1428a0;
            color: white;
            border-bottom-right-radius: 3px;
        }

        .bot .message-content {
            background: white;
            color: #222;
            border: 1px solid #ddd;
            border-bottom-left-radius: 3px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
        }

        #question {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        #send-button {
            margin-left: 10px;
            padding: 0 22px;
            border: none;
            border-radius: 8px;
            background: #1428a0;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #send-button:hover {
            opacity: 0.9;
        }

        #send-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .typing {
            font-style: italic;
            color: #777;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h1>Samsung Washing Machine AI Support</h1>
        <p>RAG-based Technical Support Assistant</p>
    </div>

    <div class="chat-box" id="chat-box">

        <div class="message bot">
            <div class="message-content">
                Hello! 👋
                How can I help you with your Samsung washing machine?
            </div>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask a question..."
            autocomplete="off"
        >

        <button id="send-button">
            Send
        </button>

    </div>

</div>

<script>

const API_URL =
    "https://uji26268tj.execute-api.us-east-1.amazonaws.com/chat";


const chatBox = document.getElementById("chat-box");
const questionInput = document.getElementById("question");
const sendButton = document.getElementById("send-button");


function addMessage(message, type) {

    const messageDiv = document.createElement("div");

    messageDiv.className = `message ${type}`;

    const contentDiv = document.createElement("div");

    contentDiv.className = "message-content";

    contentDiv.textContent = message;

    messageDiv.appendChild(contentDiv);

    chatBox.appendChild(messageDiv);

    chatBox.scrollTop = chatBox.scrollHeight;
}


async function sendMessage() {

    const question = questionInput.value.trim();

    if (!question) {
        return;
    }

    addMessage(question, "user");

    questionInput.value = "";

    sendButton.disabled = true;

    addMessage("Thinking...", "bot");

    const thinkingMessage =
        chatBox.lastElementChild;


    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                query: question
            })

        });


        if (!response.ok) {

            throw new Error(
                `HTTP error: ${response.status}`
            );

        }


        const data = await response.json();


        thinkingMessage
            .querySelector(".message-content")
            .textContent = data.answer;


    } catch (error) {

        console.error(error);

        thinkingMessage
            .querySelector(".message-content")
            .textContent =
                "Sorry, I could not connect to the AI service.";

    }


    sendButton.disabled = false;

    questionInput.focus();
}


sendButton.addEventListener(
    "click",
    sendMessage
);


questionInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);

</script>

</body>
</html>

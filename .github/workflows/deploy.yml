name: Deploy Samsung RAG Chatbot

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: samsung-washing-machine-rag-chatbot
  LAMBDA_FUNCTION_NAME: Samsung-Washing-Machine-RAG-Chatbot

jobs:

  # ==========================================
  # CI - TEST APPLICATION
  # ==========================================
  test:
    name: CI - Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/rag.py

      - name: CI successful
        run: |
          echo "======================================"
          echo "✅ CI TESTS PASSED"
          echo "======================================"


  # ==========================================
  # BUILD, PUSH AND DEPLOY
  # ==========================================
  build-and-deploy:
    name: Build, Push and Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:

      # ======================================
      # CHECKOUT
      # ======================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================
      # AWS AUTHENTICATION
      # ======================================
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::979604620994:role/GitHubActions-SamsungRAG-Deploy
          aws-region: ${{ env.AWS_REGION }}


      # ======================================
      # ECR LOGIN
      # ======================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ======================================
      # BUILD DOCKER IMAGE
      # ======================================
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .


      # ======================================
      # TAG DOCKER IMAGE
      # ======================================
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}


      # ======================================
      # PUSH IMAGE TO ECR
      # ======================================
      - name: Push Docker image to Amazon ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}


      # ======================================
      # UPDATE LAMBDA
      # ======================================
      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"


      # ======================================
      # WAIT FOR LAMBDA
      # ======================================
      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"


      # ======================================
      # VERIFY LAMBDA DEPLOYMENT
      # ======================================
      - name: Verify Lambda deployment
        run: |
          echo "======================================"
          echo "Lambda deployment verification"
          echo "======================================"

          aws lambda get-function \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query 'Configuration.[FunctionName,LastModified,State,LastUpdateStatus]' \
            --output table

          echo "======================================"
          echo "Lambda image information"
          echo "======================================"

          aws lambda get-function \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query 'Code.[ImageUri,ResolvedImageUri]' \
            --output text


      # ======================================
      # DEPLOYMENT SUCCESS
      # ======================================
      - name: Deployment successful
        run: |
          echo "======================================"
          echo "✅ CI/CD DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Application: Samsung Washing Machine RAG Chatbot"
          echo "Lambda: $LAMBDA_FUNCTION_NAME"
          echo "ECR Repository: $ECR_REPOSITORY"
          echo "AWS Region: $AWS_REGION"
          echo "Image Tag: ${{ github.sha }}"
          echo "======================================"

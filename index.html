<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI-powered Samsung washing machine technical support chatbot using RAG."
    >

    <meta
        name="theme-color"
        content="#1428a0"
    >

    <title>Samsung Washing Machine AI Support</title>


    <style>

        /* =========================================================
           ROOT / DESIGN TOKENS
        ========================================================= */

        :root {

            --primary: #1428a0;
            --primary-light: #3154d8;
            --primary-dark: #0c176b;

            --accent: #6c8cff;
            --accent-light: #9db2ff;

            --success: #19c37d;
            --danger: #ef5350;

            --bg-1: #eef3ff;
            --bg-2: #f7f9ff;

            --surface: rgba(255, 255, 255, 0.82);
            --surface-solid: #ffffff;

            --text: #172033;
            --text-soft: #68738a;
            --border: rgba(20, 40, 160, 0.12);

            --shadow:
                0 25px 70px rgba(20, 40, 160, 0.16);

            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;

            --transition:
                220ms cubic-bezier(.2,.8,.2,1);

        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            height: 100%;
            scroll-behavior: smooth;
        }


        body {

            min-height: 100%;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(78, 116, 255, 0.20),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 20%,
                    rgba(130, 92, 255, 0.18),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(20, 40, 160, 0.12),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    var(--bg-1),
                    var(--bg-2)
                );

            overflow: hidden;
        }


        button,
        input {
            font: inherit;
        }


        button {
            border: 0;
        }


        /* =========================================================
           ANIMATED BACKGROUND
        ========================================================= */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .orb {

            position: absolute;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0.28;

            animation:
                floatingOrb 12s ease-in-out infinite;
        }


        .orb.one {

            background:
                rgba(54, 91, 255, 0.45);

            top: -100px;
            left: -80px;
        }


        .orb.two {

            background:
                rgba(139, 78, 255, 0.35);

            right: -100px;
            top: 20%;

            animation-delay: -4s;
        }


        .orb.three {

            background:
                rgba(40, 170, 255, 0.25);

            left: 35%;
            bottom: -160px;

            animation-delay: -8s;
        }


        @keyframes floatingOrb {

            0%,
            100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(30px, -25px, 0)
                    scale(1.08);
            }
        }


        /* =========================================================
           APP
        ========================================================= */

        .app {

            position: relative;

            z-index: 1;

            width: min(100%, 900px);

            height: min(94vh, 920px);

            margin: 3vh auto;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            background:
                rgba(255, 255, 255, 0.72);

            border:
                1px solid rgba(255,255,255,0.7);

            border-radius:
                var(--radius-xl);

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);

            animation:
                appEnter 700ms
                cubic-bezier(.2,.8,.2,1)
                both;
        }


        @keyframes appEnter {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {

            position: relative;

            padding:
                22px 24px 20px;

            color: white;

            background:

                linear-gradient(
                    135deg,
                    #0d1d83 0%,
                    #1428a0 48%,
                    #3154d8 100%
                );

            overflow: hidden;
        }


        .header::before {

            content: "";

            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.09);

            top: -180px;
            right: -50px;

            animation:
                headerGlow 8s
                ease-in-out infinite;
        }


        @keyframes headerGlow {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }


        .header-content {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 16px;

            z-index: 2;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 14px;

            min-width: 0;
        }


        .brand-icon {

            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: grid;

            place-items: center;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.14);

            border:
                1px solid rgba(255,255,255,0.24);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.25);

            font-size: 24px;

            animation:
                iconPulse 3s
                ease-in-out infinite;
        }


        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }


        .brand-text h1 {

            font-size: clamp(17px, 3vw, 23px);

            font-weight: 800;

            letter-spacing: -0.4px;

            line-height: 1.2;
        }


        .brand-text p {

            margin-top: 4px;

            font-size: 12px;

            color:
                rgba(255,255,255,0.78);
        }


        /* =========================================================
           STATUS
        ========================================================= */

        .status {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                7px 11px;

            border-radius: 999px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid
                rgba(255,255,255,0.18);

            font-size: 11px;

            white-space: nowrap;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                #5df2ad;

            box-shadow:
                0 0 12px
                rgba(93,242,173,.8);

            animation:
                statusPulse 2s
                ease-in-out infinite;
        }


        @keyframes statusPulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .45;
                transform: scale(.75);
            }
        }


        /* =========================================================
           TOOLBAR
        ========================================================= */

        .toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding:
                10px 18px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(255,255,255,.55);
        }


        .toolbar-label {

            font-size: 11px;

            color: var(--text-soft);

            font-weight: 600;
        }


        .clear-button {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding:
                7px 11px;

            border-radius: 9px;

            background:
                transparent;

            color:
                var(--text-soft);

            cursor: pointer;

            transition:
                color var(--transition),
                background var(--transition),
                transform var(--transition);
        }


        .clear-button:hover {

            background:
                rgba(20,40,160,.07);

            color:
                var(--primary);

            transform:
                translateY(-1px);
        }


        /* =========================================================
           CHAT AREA
        ========================================================= */

        .chat-box {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding:
                22px 22px 14px;

            scroll-behavior: smooth;

            background:
                rgba(248,249,252,.72);
        }


        .chat-box::-webkit-scrollbar {
            width: 7px;
        }


        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }


        .chat-box::-webkit-scrollbar-thumb {

            background:
                rgba(20,40,160,.16);

            border-radius:
                999px;
        }


        /* =========================================================
           WELCOME
        ========================================================= */

        .welcome {

            margin:
                5px auto 22px;

            max-width: 650px;

            padding: 22px;

            text-align: center;

            border-radius:
                var(--radius-lg);

            background:
                rgba(255,255,255,.78);

            border:
                1px solid
                rgba(20,40,160,.09);

            box-shadow:
                0 12px 35px
                rgba(20,40,160,.06);

            animation:
                welcomeEnter 700ms
                300ms
                both;
        }


        @keyframes welcomeEnter {

            from {

                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .welcome-icon {

            font-size: 30px;

            margin-bottom: 8px;

            display: inline-block;

            animation:
                wave 2.5s
                ease-in-out infinite;
        }


        @keyframes wave {

            0%,
            70%,
            100% {
                transform: rotate(0);
            }

            75% {
                transform: rotate(15deg);
            }

            82% {
                transform: rotate(-10deg);
            }

            89% {
                transform: rotate(10deg);
            }

            95% {
                transform: rotate(-4deg);
            }
        }


        .welcome h2 {

            font-size: 17px;

            margin-bottom: 7px;
        }


        .welcome p {

            font-size: 13px;

            color:
                var(--text-soft);

            line-height: 1.6;
        }


        /* =========================================================
           QUICK QUESTIONS
        ========================================================= */

        .quick-questions {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;

            margin-top: 16px;
        }


        .quick-question {

            padding:
                8px 12px;

            border-radius:
                999px;

            border:
                1px solid
                rgba(20,40,160,.13);

            background:
                rgba(255,255,255,.72);

            color:
                var(--primary);

            font-size: 12px;

            cursor: pointer;

            transition:
                transform var(--transition),
                background var(--transition),
                box-shadow var(--transition);
        }


        .quick-question:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,1);

            box-shadow:
                0 7px 18px
                rgba(20,40,160,.11);
        }


        /* =========================================================
           MESSAGES
        ========================================================= */

        .message {

            display: flex;

            margin-bottom: 15px;

            animation:
                messageIn 360ms
                cubic-bezier(.2,.8,.2,1)
                both;
        }


        @keyframes messageIn {

            from {

                opacity: 0;

                transform:
                    translateY(10px)
                    scale(.98);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        .message.user {

            justify-content:
                flex-end;
        }


        .message.bot {

            justify-content:
                flex-start;
        }


        .message-content {

            max-width:
                min(82%, 650px);

            padding:
                13px 16px;

            border-radius:
                17px;

            line-height:
                1.6;

            font-size:
                14px;

            overflow-wrap:
                anywhere;

            position: relative;
        }


        .message.user
        .message-content {

            color:
                white;

            background:

                linear-gradient(
                    135deg,
                    #1428a0,
                    #3154d8
                );

            border-bottom-right-radius:
                5px;

            box-shadow:
                0 8px 20px
                rgba(20,40,160,.18);
        }


        .message.bot
        .message-content {

            color:
                #1c2537;

            background:
                rgba(255,255,255,.88);

            border:
                1px solid
                rgba(20,40,160,.10);

            border-bottom-left-radius:
                5px;

            box-shadow:
                0 6px 20px
                rgba(20,40,160,.055);
        }


        .message.bot
        .message-content strong {

            color:
                var(--primary);

            font-weight:
                750;
        }


        .message.bot
        .message-content code {

            padding:
                2px 6px;

            border-radius:
                6px;

            background:
                #edf1ff;

            color:
                var(--primary);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                monospace;

            font-size:
                12px;
        }


        .message-meta {

            display: flex;

            align-items: center;

            gap: 6px;

            margin-top: 7px;

            font-size: 10px;

            opacity: .58;
        }


        /* =========================================================
           TYPING INDICATOR
        ========================================================= */

        .typing-wrapper {

            display: flex;

            align-items: center;

            gap: 9px;
        }


        .typing-dots {

            display: flex;

            align-items: center;

            gap: 4px;
        }


        .typing-dots span {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                var(--primary);

            animation:
                typingDot 1.2s
                ease-in-out infinite;
        }


        .typing-dots span:nth-child(2) {
            animation-delay: .15s;
        }


        .typing-dots span:nth-child(3) {
            animation-delay: .30s;
        }


        @keyframes typingDot {

            0%,
            60%,
            100% {

                transform:
                    translateY(0);

                opacity: .35;
            }

            30% {

                transform:
                    translateY(-5px);

                opacity: 1;
            }
        }


        /* =========================================================
           INPUT AREA
        ========================================================= */

        .input-section {

            padding:
                13px 16px 16px;

            background:
                rgba(255,255,255,.82);

            border-top:
                1px solid
                var(--border);
        }


        .input-container {

            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                6px 6px 6px 14px;

            border-radius:
                15px;

            background:
                white;

            border:
                1px solid
                rgba(20,40,160,.14);

            box-shadow:
                0 5px 20px
                rgba(20,40,160,.07);

            transition:
                border-color var(--transition),
                box-shadow var(--transition);
        }


        .input-container:focus-within {

            border-color:
                rgba(49,84,216,.55);

            box-shadow:
                0 0 0 4px
                rgba(49,84,216,.09),
                0 8px 25px
                rgba(20,40,160,.09);
        }


        #question {

            flex: 1;

            min-width: 0;

            border: 0;

            outline: 0;

            padding:
                10px 0;

            background:
                transparent;

            color:
                var(--text);

            font-size:
                14px;
        }


        #question::placeholder {

            color:
                #98a1b4;
        }


        .send-button {

            position: relative;

            min-width:
                92px;

            height:
                42px;

            padding:
                0 17px;

            border-radius:
                11px;

            color:
                white;

            background:
                linear-gradient(
                    135deg,
                    #1428a0,
                    #3154d8
                );

            cursor:
                pointer;

            font-weight:
                700;

            font-size:
                13px;

            overflow:
                hidden;

            transition:
                transform var(--transition),
                box-shadow var(--transition),
                opacity var(--transition);
        }


        .send-button::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    110deg,
                    transparent 25%,
                    rgba(255,255,255,.30),
                    transparent 75%
                );

            transform:
                translateX(-120%);

            transition:
                transform 600ms ease;
        }


        .send-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 9px 22px
                rgba(20,40,160,.25);
        }


        .send-button:hover::before {

            transform:
                translateX(120%);
        }


        .send-button:active {

            transform:
                translateY(0)
                scale(.97);
        }


        .send-button:disabled {

            opacity:
                .55;

            cursor:
                not-allowed;

            transform:
                none;

            box-shadow:
                none;
        }


        .send-button span {

            position:
                relative;

            z-index:
                2;
        }


        /* =========================================================
           CHARACTER COUNT
        ========================================================= */

        .input-footer {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 7px;

            padding:
                0 3px;
        }


        .hint {

            color:
                #8b94a8;

            font-size:
                10px;
        }


        #char-count {

            color:
                #8b94a8;

            font-size:
                10px;
        }


        /* =========================================================
           FOCUS ACCESSIBILITY
        ========================================================= */

        button:focus-visible,
        input:focus-visible {

            outline:
                3px solid
                rgba(49,84,216,.30);

            outline-offset:
                2px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 700px) {

            body {
                overflow: hidden;
            }

            .app {

                width: 100%;

                height: 100vh;

                margin: 0;

                border-radius: 0;

                border: 0;
            }

            .header {

                padding:
                    17px 16px;
            }

            .brand-icon {

                width: 42px;
                height: 42px;

                border-radius: 13px;

                font-size: 21px;
            }

            .status {

                padding:
                    6px 8px;

                font-size: 9px;
            }

            .chat-box {

                padding:
                    16px 13px 10px;
            }

            .message-content {

                max-width:
                    88%;

                font-size:
                    13px;
            }

            .welcome {

                padding:
                    17px;

                margin-bottom:
                    17px;
            }

            .quick-question {

                font-size:
                    11px;

                padding:
                    7px 10px;
            }

            .input-section {

                padding:
                    10px;
            }

            .send-button {

                min-width:
                    75px;
            }
        }


        @media (max-width: 430px) {

            .brand-text p {
                display: none;
            }

            .brand-text h1 {
                font-size: 16px;
            }

            .status {
                display: none;
            }

            .message-content {
                max-width: 92%;
            }

            .toolbar-label {
                font-size: 10px;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

                scroll-behavior:
                    auto !important;
            }

            .orb {
                display: none;
            }
        }


        /* =========================================================
           FALLBACK IF BACKDROP FILTER IS NOT SUPPORTED
        ========================================================= */

        @supports not (
            backdrop-filter: blur(10px)
        ) {

            .app {

                background:
                    rgba(255,255,255,.97);
            }

            .toolbar,
            .input-section {

                background:
                    #ffffff;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     ANIMATED BACKGROUND
========================================================= -->

<div
    class="background"
    aria-hidden="true"
>

    <div class="orb one"></div>

    <div class="orb two"></div>

    <div class="orb three"></div>

</div>


<!-- =========================================================
     APPLICATION
========================================================= -->

<main
    class="app"
    aria-label="Samsung Washing Machine AI Support"
>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="header-content">

            <div class="brand">

                <div
                    class="brand-icon"
                    aria-hidden="true"
                >
                    🫧
                </div>

                <div class="brand-text">

                    <h1>
                        Samsung Washing Machine AI Support
                    </h1>

                    <p>
                        RAG-based Technical Support Assistant
                    </p>

                </div>

            </div>


            <div
                class="status"
                aria-label="AI service online"
            >

                <span
                    class="status-dot"
                    aria-hidden="true"
                ></span>

                <span>
                    AI Online
                </span>

            </div>

        </div>

    </header>


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <div class="toolbar">

        <span class="toolbar-label">
            AI Technical Support
        </span>

        <button
            class="clear-button"
            id="clear-button"
            type="button"
            aria-label="Clear conversation"
        >
            🗑️
            <span>Clear chat</span>
        </button>

    </div>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <section
        class="chat-box"
        id="chat-box"
        aria-live="polite"
        aria-label="Chat messages"
    >


        <!-- =================================================
             WELCOME
        ================================================== -->

        <div
            class="welcome"
            id="welcome"
        >

            <div
                class="welcome-icon"
                aria-hidden="true"
            >
                👋
            </div>

            <h2>
                Hello! How can I help?
            </h2>

            <p>
                Ask me about washing-machine operation,
                error codes, drainage, vibration,
                maintenance, or door-lock issues.
            </p>


            <div
                class="quick-questions"
                aria-label="Suggested questions"
            >

                <button
                    class="quick-question"
                    type="button"
                    data-question="How do I start a wash cycle?"
                >
                    ▶️ Start a wash cycle
                </button>

                <button
                    class="quick-question"
                    type="button"
                    data-question="What does error code 4C mean?"
                >
                    💧 Error 4C
                </button>

                <button
                    class="quick-question"
                    type="button"
                    data-question="What does error code 5C mean?"
                >
                    🚿 Error 5C
                </button>

                <button
                    class="quick-question"
                    type="button"
                    data-question="Why is my washing machine vibrating?"
                >
                    📳 Vibration
                </button>

                <button
                    class="quick-question"
                    type="button"
                    data-question="Why is the washing machine door locked?"
                >
                    🔒 Door locked
                </button>

            </div>

        </div>


    </section>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <section class="input-section">

        <div class="input-container">

            <input
                type="text"
                id="question"
                maxlength="500"
                placeholder="Ask a question about your washing machine..."
                autocomplete="off"
                aria-label="Ask a technical support question"
            >


            <button
                id="send-button"
                class="send-button"
                type="button"
                aria-label="Send question"
            >

                <span>
                    Send ✦
                </span>

            </button>

        </div>


        <div class="input-footer">

            <span class="hint">
                Press Enter to send
            </span>

            <span id="char-count">
                0 / 500
            </span>

        </div>

    </section>


</main>


<script>

    /* =========================================================
       API CONFIGURATION
    ========================================================= */

    const API_URL =
        "https://uji26268tj.execute-api.us-east-1.amazonaws.com/chat";


    /* =========================================================
       DOM ELEMENTS
    ========================================================= */

    const chatBox =
        document.getElementById("chat-box");

    const questionInput =
        document.getElementById("question");

    const sendButton =
        document.getElementById("send-button");

    const clearButton =
        document.getElementById("clear-button");

    const welcome =
        document.getElementById("welcome");

    const charCount =
        document.getElementById("char-count");


    /* =========================================================
       HTML ESCAPING
       Prevents API content from becoming executable HTML.
    ========================================================= */

    function escapeHtml(text) {

        return String(text)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");
    }


    /* =========================================================
       MARKDOWN-LIKE FORMATTER
    ========================================================= */

    function formatMessage(message) {

        let html =
            escapeHtml(message);


        /* Bold */

        html = html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


        /* Inline code */

        html = html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


        /* Numbered lists */

        html = html.replace(
            /(^|\n)(\d+)\.\s/g,
            "$1<span class=\"list-number\">$2.</span> "
        );


        /* Bullet points */

        html = html.replace(
            /(^|\n)-\s/g,
            "$1• "
        );


        /* Line breaks */

        html =
            html.replace(/\n/g, "<br>");


        return html;
    }


    /* =========================================================
       ADD MESSAGE
    ========================================================= */

    function addMessage(message, type) {

        const messageDiv =
            document.createElement("div");


        messageDiv.className =
            `message ${type}`;


        const contentDiv =
            document.createElement("div");


        contentDiv.className =
            "message-content";


        if (type === "bot") {

            contentDiv.innerHTML =
                formatMessage(message);

        } else {

            contentDiv.textContent =
                message;
        }


        messageDiv.appendChild(
            contentDiv
        );


        chatBox.appendChild(
            messageDiv
        );


        scrollToBottom();


        return messageDiv;
    }


    /* =========================================================
       TYPING MESSAGE
    ========================================================= */

    function addTypingMessage() {

        const messageDiv =
            document.createElement("div");


        messageDiv.className =
            "message bot";


        messageDiv.dataset.typing =
            "true";


        const contentDiv =
            document.createElement("div");


        contentDiv.className =
            "message-content";


        contentDiv.innerHTML = `

            <div class="typing-wrapper">

                <span>
                    AI is thinking
                </span>

                <div class="typing-dots">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        `;


        messageDiv.appendChild(
            contentDiv
        );


        chatBox.appendChild(
            messageDiv
        );


        scrollToBottom();


        return messageDiv;
    }


    /* =========================================================
       REMOVE TYPING
    ========================================================= */

    function removeTypingMessage() {

        const typingMessage =
            chatBox.querySelector(
                '[data-typing="true"]'
            );


        if (typingMessage) {

            typingMessage.remove();
        }
    }


    /* =========================================================
       SCROLL
    ========================================================= */

    function scrollToBottom() {

        requestAnimationFrame(() => {

            chatBox.scrollTop =
                chatBox.scrollHeight;

        });
    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

        const question =
            questionInput.value.trim();


        if (!question) {

            questionInput.focus();

            return;
        }


        if (sendButton.disabled) {

            return;
        }


        /* Hide welcome screen */

        if (welcome) {

            welcome.style.display =
                "none";
        }


        /* Add user message */

        addMessage(
            question,
            "user"
        );


        /* Clear input */

        questionInput.value =
            "";

        updateCharacterCount();


        /* Disable button */

        sendButton.disabled =
            true;


        /* Typing indicator */

        const typingMessage =
            addTypingMessage();


        try {


            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({
                                query:
                                    question
                            })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const data =
                await response.json();


            /* Remove typing */

            if (typingMessage) {

                typingMessage.remove();
            }


            /* API answer */

            const answer =
                data.answer ||
                "I don't have enough information in the provided manual.";


            /* Add answer */

            addMessage(
                answer,
                "bot"
            );


        } catch (error) {

            console.error(
                "API Error:",
                error
            );


            if (typingMessage) {

                typingMessage.remove();
            }


            addMessage(
                "Sorry, I could not connect to the AI service. Please try again.",
                "bot"
            );

        }


        sendButton.disabled =
            false;


        questionInput.focus();

    }


    /* =========================================================
       CHARACTER COUNTER
    ========================================================= */

    function updateCharacterCount() {

        const length =
            questionInput.value.length;


        charCount.textContent =
            `${length} / 500`;


        if (length > 450) {

            charCount.style.color =
                "#ef5350";

        } else {

            charCount.style.color =
                "";
        }
    }


    /* =========================================================
       CLEAR CHAT
    ========================================================= */

    function clearChat() {

        const messages =
            chatBox.querySelectorAll(
                ".message"
            );


        messages.forEach(
            message =>
                message.remove()
        );


        welcome.style.display =
            "";


        questionInput.value =
            "";


        updateCharacterCount();


        questionInput.focus();

    }


    /* =========================================================
       QUICK QUESTIONS
    ========================================================= */

    document
        .querySelectorAll(".quick-question")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const question =
                        button.dataset.question;


                    questionInput.value =
                        question;


                    updateCharacterCount();


                    sendMessage();

                }
            );

        });


    /* =========================================================
       SEND BUTTON
    ========================================================= */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* =========================================================
       ENTER KEY
    ========================================================= */

    questionInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    /* =========================================================
       CHARACTER COUNT
    ========================================================= */

    questionInput.addEventListener(
        "input",
        updateCharacterCount
    );


    /* =========================================================
       CLEAR BUTTON
    ========================================================= */

    clearButton.addEventListener(
        "click",
        clearChat
    );


    /* =========================================================
       INITIAL FOCUS
    ========================================================= */

    window.addEventListener(
        "load",
        () => {

            questionInput.focus();

        }
    );

</script>

</body>
</html>
